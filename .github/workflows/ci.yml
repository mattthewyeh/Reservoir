name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+psycopg://reservoir:reservoir_ci_password@localhost:5432/reservoir_ci
      JWT_SECRET: reservoir_ci_only_signing_secret
      TEST_DATABASE_ADMIN_URL: postgresql+psycopg://reservoir:reservoir_ci_password@localhost:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: reservoir_ci
          POSTGRES_USER: reservoir
          POSTGRES_PASSWORD: reservoir_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reservoir -d reservoir_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements-dev.txt

      - name: Lint backend
        run: ruff check --output-format=github backend

      - name: Check backend formatting
        run: ruff format --check backend

      - name: Run isolated backend tests
        run: python -m pytest

      - name: Validate migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Run PostgreSQL integration tests
        run: python -m pytest -m postgres

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  containers:
    name: Containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend
      - frontend
    env:
      JWT_SECRET: reservoir_ci_only_signing_secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build api frontend

      - name: Start application stack
        run: docker compose up --detach --wait

      - name: Smoke test application
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz
          test "$(curl --fail --silent --show-error http://127.0.0.1:8080/api/health)" = '{"status":"healthy"}'
          curl --fail --silent --show-error http://127.0.0.1:8080/api/equipment

      - name: Show container logs after failure
        if: failure()
        run: docker compose logs

      - name: Stop application stack
        if: always()
        run: docker compose down --volumes

