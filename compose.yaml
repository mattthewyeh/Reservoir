services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reservoir}
      POSTGRES_USER: ${POSTGRES_USER:-reservoir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reservoir_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-reservoir}:${POSTGRES_PASSWORD:-reservoir_dev_password}@db:5432/${POSTGRES_DB:-reservoir}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173}
      ROOT_PATH: /api
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      args:
        VITE_API_URL: /api
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: api:8000
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.3
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  db-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${TEST_POSTGRES_USER:-reservoir_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-reservoir_test_password}
    ports:
      - "${TEST_POSTGRES_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  prometheus_data:
